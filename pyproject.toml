[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata"]

[project]
name = "strata-active-directory-auditing"
version = "0.1.0"
description = "Read-only Active Directory auditor with prioritized Remediation Roadmap, Tokyo Night HTML report, and Catppuccin TUI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "ldap3>=2.9",
    "gssapi>=1.8",
    "winacl>=0.1.9",
    "smbprotocol>=1.16",
    "krb5>=0.7",
    "textual>=0.52",
    "jinja2>=3.1",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
strata = "strata.cli:main"
